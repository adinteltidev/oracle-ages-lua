name: Release candidate
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prerelease tag matching VERSION, e.g. v1.0.2-rc.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate identity and tag/version relationship
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python3 tools/ci/release.py validate --tag "$REQUESTED_TAG" --candidate
          else
            python3 tools/ci/release.py validate --tag "$REQUESTED_TAG"
          fi

  build:
    needs: validate
    uses: ./.github/workflows/build-platforms.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      retention-days: 30

  draft:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Validate evidence and create checksums
        run: python3 tools/ci/release.py prepare release-assets --sha "$GITHUB_SHA"
      - name: Create draft only; never overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash tools/ci/create_draft.sh
