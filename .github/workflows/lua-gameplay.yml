name: Experimental Lua gameplay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'gameplay/**'
      - 'src/script/**'
      - 'src/game/common/interactions/switchTileToggler.c'
      - 'src/game/common/interactions/pushblockTrigger.c'
      - 'src/game/common/interactions/pushblock.c'
      - 'src/game/ages/interactions/pushblockSynchronizer.c'
      - 'src/game/ages/interactions/waterPushblock.c'
      - 'src/game/ages/interactions/stonePanel.c'
      - 'src/game/ages/interactions/miscPuzzles.c'
      - 'cmake/LuaGameplay.cmake'
      - 'tests/test_lua_gameplay*'
      - 'tests/test_lua_blocks*'
      - 'tests/test_lua_block_rules*'
      - 'tests/test_lua_cube*'
      - 'tests/lua_cube*'
      - 'tests/test_lua_sync*'
      - 'tests/lua_sync*'
      - '.github/workflows/lua-gameplay.yml'
      - '.github/workflows/build-platforms.yml'
      - 'tools/ci/**'
permissions:
  contents: read
jobs:
  decisions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure standalone bounded runtime
        run: cmake -S . -B build-lua-ci -DORACLES_SDL=OFF -DORACLES_LUA_GAMEPLAY=ON -DORACLES_LUA_BLOCK_PUZZLES=ON
      - name: Compile
        run: cmake --build build-lua-ci --config Release --target test_lua_gameplay test_lua_cube_candidate test_lua_sync_candidate test_lua_block_rules --parallel 3
      - name: Test (no commercial ROM)
        run: ctest --test-dir build-lua-ci -C Release -R "^(lua_gameplay|lua_cube_candidate|lua_sync_candidate|lua_block_rules)$" --output-on-failure
  artifacts:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-platforms.yml
    with:
      lua-gameplay: true
      retention-days: 7
