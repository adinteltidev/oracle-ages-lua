name: Build platforms
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      retention-days:
        type: number
        default: 7
      lua-gameplay:
        type: boolean
        default: false
env:
  ORACLES_LUA_GAMEPLAY: ${{ inputs.lua-gameplay && 'ON' || 'OFF' }}
  ORACLES_LUA_BLOCK_PUZZLES: ${{ inputs.lua-gameplay && 'ON' || 'OFF' }}
  ORACLES_LUA_COLORED_CUBE: ${{ inputs.lua-gameplay && 'ON' || 'OFF' }}
  ORACLES_LUA_LEVERS_LAVA: ${{ inputs.lua-gameplay && 'ON' || 'OFF' }}
permissions:
  contents: read
jobs:
  quality:
    name: Core tests (no commercial ROM)
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 300M
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Lint and build CI helper tests
        run: |
          python3 tools/lint_game.py
          python3 -m unittest discover -s tests/ci -v
      - name: Compiler cache
        run: |
          if ! command -v ccache; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/ccache
          key: core-linux-gcc-${{ hashFiles('CMakeLists.txt', '.github/workflows/build-platforms.yml') }}
          restore-keys: core-linux-gcc-
      - name: Build and test
        run: |
          cmake -S . -B build-ci -G Ninja -DORACLES_SDL=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DORACLES_LUA_GAMEPLAY="$ORACLES_LUA_GAMEPLAY" -DORACLES_LUA_BLOCK_PUZZLES="$ORACLES_LUA_BLOCK_PUZZLES" -DORACLES_LUA_COLORED_CUBE="$ORACLES_LUA_COLORED_CUBE" -DORACLES_LUA_LEVERS_LAVA="$ORACLES_LUA_LEVERS_LAVA"
          cmake --build build-ci --parallel 3
          mkdir -p reports dist/sources
          ctest --test-dir build-ci --output-on-failure --output-junit "$PWD/reports/quality.xml"
          python3 tools/ci/source_archive.py dist/sources/oracle-ages-native-source.tar.gz
      - name: Test summary
        if: always()
        run: python3 tools/ci/test_summary.py reports/quality.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: core-reports-${{ github.sha }}
          path: reports/*.xml
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-sources-${{ github.sha }}
          path: dist/sources/*
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  windows:
    name: Build Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ORACLES_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .tools/llvm
          key: llvm-linux-x64-${{ hashFiles('tools/fetch_windows_toolchain.py') }}
      - name: Build, audit and package
        run: bash tools/ci/build.sh windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-windows-${{ github.sha }}
          path: dist/windows/*
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-input-${{ github.sha }}
          path: reports/smoke-input.zip
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  windows-smoke:
    name: Run native Windows smoke tests
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: smoke-input-${{ github.sha }}
          path: smoke
      - name: Exercise PE binaries without a ROM
        run: python tools/ci/windows_smoke.py smoke --output dist/windows-SMOKE.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-windows-smoke-${{ github.sha }}
          path: dist/windows-SMOKE.json
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  macos:
    name: Build macOS Intel
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      ORACLES_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build, test, audit and package
        run: bash tools/ci/build.sh macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-macos-${{ github.sha }}
          path: dist/macos/*
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: macos-reports-${{ github.sha }}
          path: reports/*.xml
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: warn

  switch:
    name: Build Nintendo Switch (LLVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .tools/llvm
          key: llvm-linux-x64-${{ hashFiles('tools/fetch_windows_toolchain.py') }}
      - name: Build, audit and package NRO
        run: bash tools/ci/build.sh switch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-switch-${{ github.sha }}
          path: dist/switch/*
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
